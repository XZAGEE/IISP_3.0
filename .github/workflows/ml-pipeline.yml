name: ml-pipeline

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs"
        type: number
        default: 30
        required: true

      push_image:
        description: "Publish image to GHCR"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EPOCHS: ${{ inputs.epochs || (github.event_name == 'pull_request' && '3' || '30') }}
  MIN_ACCURACY: ${{ github.event_name == 'pull_request' && '60' || '80' }}

jobs:

  # ========================================
  # JOB 1: LINT
  # ========================================

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff==0.17.6

      - name: Check Python code
        run: ruff check src/ scripts/


  # ========================================
  # JOB 2: TRAIN
  # ========================================

  train:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build trainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: trainer
          load: true
          tags: kws-trainer:ci
          cache-from: type=gha,scope=trainer
          cache-to: type=gha,mode=max,scope=trainer

      - name: Train model in Docker
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts

          docker run --rm \
            -v "$PWD/artifacts:/artifacts" \
            kws-trainer:ci \
            --classes yes no up down \
            --epochs "$EPOCHS" \
            --seed 42 \
            --dataset ci_dataset \
            --out /artifacts \
            2>&1 | tee artifacts/train.log

      - name: Check generated artifacts
        run: |
          test -s artifacts/model.pt
          test -s artifacts/labels.json
          test -s artifacts/metrics.json
          test -s artifacts/train.log

          cat artifacts/metrics.json
          ls -lh artifacts/

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: artifacts/
          retention-days: 14
          if-no-files-found: error


  # ========================================
  # JOB 3: VERIFY
  # ========================================

  verify:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare metrics directory
        run: mkdir -p metrics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model
          path: artifacts/

      - name: Install verification dependencies
        run: pip install requests

      - name: Build runtime image
        run: |
          docker build \
            --target runtime \
            -t kws-api:ci .

      - name: Start service
        id: service
        run: |
          docker run -d \
            --name kws \
            -p 8000:8000 \
            kws-api:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health \
              | jq -e '.status == "healthy" and .model_loaded == true'; then
              exit 0
            fi

            sleep 2
          done

          docker logs kws
          exit 1

      - name: Golden-sample check
        run: |
          python scripts/verify_model.py \
            --url http://localhost:8000 \
            --expected samples/expected.json \
            --out metrics/verify.json

      - name: Quality gate (accuracy)
        if: ${{ !cancelled() && steps.service.outcome == 'success' }}
        run: |
          set -o pipefail

          curl -fsS http://localhost:8000/model-info \
            | tee metrics/model-info.json

          echo "Minimum accuracy: $MIN_ACCURACY%"

          jq -e ".accuracy >= $MIN_ACCURACY" \
            metrics/model-info.json

      - name: Latency benchmark
        if: ${{ !cancelled() && steps.service.outcome == 'success' }}
        run: |
          python scripts/benchmark.py \
            --url http://localhost:8000 \
            --n 100 \
            --warmup 10 \
            --out metrics/latency.json

      - name: Generate report
        if: always()
        run: |
          mkdir -p metrics

          docker logs kws \
            > metrics/service.log 2>&1 || true

          python scripts/make_report.py \
            --metrics metrics/ \
            --out metrics/report.md

          cat metrics/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: metrics/
          retention-days: 14
          if-no-files-found: error

      - name: Stop service
        if: always()
        run: docker rm -f kws || true


  # ========================================
  # JOB 4: BUILD AND PUSH
  # ========================================

  build-push:
    needs: verify

    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.push_image)

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model
          path: artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/kws-api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime